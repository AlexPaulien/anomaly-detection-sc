<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anomaly Triage</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb; --surface-2: #f3f2ef; --border: #e3e2dd;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #85847d;
    --grid: #e9e8e3; --line: #52514e;
    --if: #eb6834;   /* Isolation Forest — categorical slot 2 */
    --ae: #2a78d6;   /* LSTM autoencoder — categorical slot 1 */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19; --surface-2: #242423; --border: #383835;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e85;
      --grid: #2e2e2c; --line: #c3c2b7;
      --if: #d95926; --ae: #3987e5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #242423; --border: #383835;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e85;
    --grid: #2e2e2c; --line: #c3c2b7;
    --if: #d95926; --ae: #3987e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    min-height: 100vh; background: var(--surface-1); color: var(--text-primary);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  header a { color: var(--text-secondary); font-size: 13px; }
  .sub { color: var(--text-secondary); margin: 4px 0 20px; max-width: 70ch; }

  .filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .filters label { font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; align-items: center; }
  select, input[type=search] {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }
  input[type=search] { width: 190px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; padding: 6px 12px; border: 0; background: transparent;
    color: var(--text-secondary); cursor: pointer; border-left: 1px solid var(--border);
  }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed=true] { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .t-label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .tile .t-value { font-size: 26px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
  .tile .t-note { font-size: 12px; color: var(--text-muted); }
  @media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

  .dots { display: inline-flex; gap: 3px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--text-muted); background: transparent; }
  .dot.if.on { background: var(--if); border-color: var(--if); }
  .dot.ae.on { background: var(--ae); border-color: var(--ae); }

  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--text-secondary);
    padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2);
  }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover, tbody tr.row:focus { background: var(--surface-2); outline: none; }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rank { color: var(--text-muted); width: 36px; }
  .sid { font-weight: 600; white-space: nowrap; }
  .smeta { font-size: 12px; color: var(--text-muted); }
  .tier { white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .delta { font-size: 12px; color: var(--text-secondary); }
  .meter { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--grid); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .fill.if { background: var(--if); } .fill.ae { background: var(--ae); }
  .fill.off { opacity: .35; }
  .tick { position: absolute; top: -3px; bottom: -3px; left: 95%; width: 1.5px; background: var(--text-secondary); }
  .mval { width: 38px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-secondary); }
  .spark path { fill: none; stroke: var(--line); stroke-width: 1.5px; }
  .spark circle { fill: var(--text-primary); stroke: var(--surface-1); stroke-width: 2px; }

  tr.detail td { background: var(--surface-2); padding: 14px 16px 16px; }
  .d-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .d-title { font-weight: 600; }
  .d-read { color: var(--text-secondary); font-size: 13px; max-width: 72ch; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .k-line { width: 16px; height: 2px; background: var(--line); display: inline-block; }
  .k-dash { width: 16px; border-top: 2px dashed var(--text-muted); display: inline-block; }
  .k-band { width: 14px; height: 10px; background: var(--ae); opacity: .14; display: inline-block; border-radius: 2px; }
  .k-pt { width: 9px; height: 9px; border-radius: 50%; background: var(--text-primary); display: inline-block; }
  .chart svg { width: 100%; height: auto; display: block; }
  .axis text { fill: var(--text-muted); font-size: 11px; }
  .axis path, .axis line { stroke: var(--border); }
  .gridl line { stroke: var(--grid); } .gridl path { stroke: none; }
  .empty { padding: 28px; text-align: center; color: var(--text-muted); }
  .foot { color: var(--text-muted); font-size: 12px; margin-top: 14px; max-width: 90ch; }
  .count { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 10;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.16);
  }
  #tip b { font-size: 13px; }
  #tip .tl { color: var(--text-secondary); }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <header>
    <h1>Anomaly Triage</h1>
    <a href="/">Single-series timeline →</a>
  </header>
  <p class="sub">Weekly alert queue for the dense M5 series. Each SKU × store week is scored by two
    models; alerts are ranked by the consensus score and labelled by which model fired.</p>

  <div class="filters">
    <label>Week <select id="f-week"></select></label>
    <div class="seg" id="f-tier" role="group" aria-label="Tier">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="both" aria-pressed="false">Both</button>
      <button data-v="if_only" aria-pressed="false">IF only</button>
      <button data-v="ae_only" aria-pressed="false">AE only</button>
    </div>
    <label>Category <select id="f-cat"><option value="all">All</option></select></label>
    <input type="search" id="f-q" placeholder="Filter by series id…" aria-label="Filter by series id">
  </div>

  <div class="tiles" id="tiles"></div>
  <p class="count" id="count"></p>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>#</th><th>Series</th><th>Tier</th><th class="num">Sales vs usual</th>
        <th>IF percentile</th><th>AE percentile</th><th>Last 12 months</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="foot" id="foot"></p>
</div>
<div id="tip"></div>
</div>

<!-- Real data (generated by viz/export_alerts.py). Absent -> embedded sample below. -->
<script src="alerts_data.js"></script>
<script>
const DATA = window.ALERTS_DATA || buildSample();
const IS_SAMPLE = !window.ALERTS_DATA;
const TIERS = {
  both:    { label: "Both",    hint: "High confidence — both models agree",        if: true,  ae: true  },
  if_only: { label: "IF only", hint: "Likely a point shock",                       if: true,  ae: false },
  ae_only: { label: "AE only", hint: "Likely a sustained regime change",           if: false, ae: true  },
};
const state = { week: null, tier: "all", cat: "all", q: "", open: null };
const tip = d3.select("#tip");
const fmtWk = wk => `${2000 + Math.floor((wk % 10000) / 100)} · W${String(wk % 100).padStart(2, "0")}`;
const fmtPct = p => (p * 100).toFixed(1);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function dots(tier) {
  const t = TIERS[tier], w = el("span", "dots");
  w.append(el("span", "dot if" + (t.if ? " on" : "")), el("span", "dot ae" + (t.ae ? " on" : "")));
  w.title = `Isolation Forest ${t.if ? "flagged" : "did not flag"} · Autoencoder ${t.ae ? "flagged" : "did not flag"}`;
  return w;
}

// ---- filters ---------------------------------------------------------------
const weeks = DATA.meta.weeks.slice().sort((a, b) => b - a);
state.week = weeks[0];
d3.select("#f-week").selectAll("option").data(weeks).join("option")
  .attr("value", d => d).text(d => fmtWk(d));
d3.select("#f-week").on("change", function () { state.week = +this.value; state.open = null; render(); });
const cats = Array.from(new Set(Object.values(DATA.weeks).flatMap(w => w.alerts.map(a => a.cat)))).sort();
d3.select("#f-cat").selectAll("option.c").data(cats).join("option").attr("class", "c")
  .attr("value", d => d).text(d => d);
d3.select("#f-cat").on("change", function () { state.cat = this.value; state.open = null; render(); });
d3.selectAll("#f-tier button").on("click", function () {
  state.tier = this.dataset.v; state.open = null;
  d3.selectAll("#f-tier button").attr("aria-pressed", function () { return this.dataset.v === state.tier; });
  render();
});
d3.select("#f-q").on("input", function () { state.q = this.value.trim().toLowerCase(); state.open = null; render(); });

// ---- render ----------------------------------------------------------------
function render() {
  const W = DATA.weeks[state.week];
  renderTiles(W);
  const rows = W.alerts.filter(a =>
    (state.tier === "all" || a.tier === state.tier) &&
    (state.cat === "all" || a.cat === state.cat) &&
    (!state.q || a.id.toLowerCase().includes(state.q)));

  const shown = W.alerts.length, total = W.counts.total;
  document.getElementById("count").textContent =
    `${rows.length} alert${rows.length === 1 ? "" : "s"} shown` +
    (shown < total ? ` · table holds the top ${shown} of ${total.toLocaleString()} flagged this week` : "");

  const tb = document.getElementById("rows");
  tb.replaceChildren();
  if (!rows.length) {
    const tr = el("tr"), td = el("td", "empty", "No alerts match these filters.");
    td.colSpan = 7; tr.append(td); tb.append(tr);
  }
  rows.forEach((a, i) => {
    const tr = el("tr", "row"); tr.tabIndex = 0;
    tr.setAttribute("aria-expanded", state.open === a.id);
    tr.append(el("td", "rank num", String(i + 1)));

    const s = el("td");
    s.append(el("div", "sid", a.id), el("div", "smeta", `${a.cat} · ${a.store}`));
    tr.append(s);

    const t = el("td"), tw = el("div", "tier");
    tw.append(dots(a.tier), el("span", null, TIERS[a.tier].label));
    t.append(tw); tr.append(t);

    const v = el("td", "num");
    const d = a.usual > 0 ? (a.sales - a.usual) / a.usual : null;
    v.append(el("div", null, `${a.sales} vs ~${a.usual}`),
             el("div", "delta", d == null ? "—" : `${d >= 0 ? "+" : "−"}${Math.abs(d * 100).toFixed(0)}%`));
    tr.append(v);

    tr.append(meterCell(a.pif, "if"), meterCell(a.pae, "ae"));

    const sp = el("td"); sp.append(sparkline(a)); tr.append(sp);

    const toggle = () => { state.open = state.open === a.id ? null : a.id; render(); };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    tb.append(tr);

    if (state.open === a.id) tb.append(detailRow(a, W));
  });

  document.getElementById("foot").textContent =
    (IS_SAMPLE ? "Showing embedded sample data — run viz/export_alerts.py for real alerts. " : "") +
    `Percentiles rank each model's score against clearly-normal weeks; a model flags above the 95th ` +
    `(tick). The consensus is the higher of the two, thresholded for a ${Math.round(DATA.meta.fp_budget * 100)}% ` +
    `false-positive budget. The autoencoder scores a ${DATA.meta.window}-week window centred on the week, ` +
    `so the most recent ${DATA.meta.lag_weeks} weeks are not yet scorable.`;
}

function renderTiles(W) {
  const c = W.counts, share = c.scored ? (c.total / c.scored * 100).toFixed(1) : "0";
  const defs = [
    { label: "Alerts this week", value: c.total, note: `${share}% of ${c.scored.toLocaleString()} series scored` },
    { label: "Both", tier: "both", value: c.both, note: TIERS.both.hint },
    { label: "IF only", tier: "if_only", value: c.if_only, note: TIERS.if_only.hint },
    { label: "AE only", tier: "ae_only", value: c.ae_only, note: TIERS.ae_only.hint },
  ];
  const root = document.getElementById("tiles"); root.replaceChildren();
  defs.forEach(d => {
    const t = el("div", "tile"), l = el("div", "t-label");
    if (d.tier) l.append(dots(d.tier));
    l.append(el("span", null, d.label));
    t.append(l, el("div", "t-value", d.value.toLocaleString()), el("div", "t-note", d.note));
    root.append(t);
  });
}

function meterCell(p, key) {
  const td = el("td"), m = el("div", "meter"), tr = el("div", "track");
  const f = el("div", `fill ${key}` + (p >= 0.95 ? "" : " off"));
  f.style.width = `${Math.max(2, p * 100)}%`;
  tr.append(f, el("div", "tick"));
  m.append(tr, el("span", "mval", fmtPct(p)));
  m.title = `${key === "if" ? "Isolation Forest" : "Autoencoder"}: ${fmtPct(p)}th percentile of normal weeks`;
  td.append(m); return td;
}

function sparkline(a) {
  const w = 132, h = 30, p = 4;
  const x = d3.scaleLinear([0, a.h.length - 1], [p, w - p]);
  const y = d3.scaleLinear([0, d3.max(a.h) || 1], [h - p, p]);
  const svg = d3.create("svg").attr("class", "spark").attr("width", w).attr("height", h)
    .attr("role", "img").attr("aria-label", `Weekly sales, alert week at ${a.sales}`);
  svg.append("path").attr("d", d3.line().x((d, i) => x(i)).y(d => y(d))(a.h));
  svg.append("circle").attr("cx", x(a.hi)).attr("cy", y(a.h[a.hi])).attr("r", 4);
  return svg.node();
}

function detailRow(a, W) {
  const tr = el("tr", "detail"), td = el("td"); td.colSpan = 7;
  const head = el("div", "d-head"), left = el("div");
  left.append(el("div", "d-title", `${a.id} — week ${fmtWk(state.week)}`));
  const read = a.tier === "both"
    ? "Both models flag this week: it is abnormal against the recent weeks and its 13-week shape is unlike normal windows."
    : a.tier === "if_only"
      ? "Only the Isolation Forest fires: the week breaks sharply from the last 13 weeks, but the surrounding shape still looks ordinary — typical of a one-off shock."
      : "Only the autoencoder fires: the week is unremarkable against its recent weeks, but the 13-week shape around it is unlike normal windows — typical of a level that has shifted and stayed.";
  left.append(el("div", "d-read", read));
  head.append(left); td.append(head);

  const chart = el("div", "chart"); td.append(chart);
  const lg = el("div", "legend");
  [["k-line", "Weekly sales"], ["k-pt", "Alert week"], ["k-dash", "Usual level (prior 13-week mean)"],
   ["k-band", "Window the autoencoder scored"]].forEach(([k, t]) => {
    const s = el("span"); s.append(el("i", k), el("span", null, t)); lg.append(s);
  });
  td.append(lg); tr.append(td);
  requestAnimationFrame(() => drawDetail(chart, a, W));
  return tr;
}

function drawDetail(node, a, W) {
  const width = Math.max(520, node.clientWidth || 900), height = 240;
  const m = { top: 14, right: 16, bottom: 28, left: 44 };
  const n = a.h.length, hw = W.hw.slice(W.hw.length - n);
  const x = d3.scaleLinear([0, n - 1], [m.left, width - m.right]);
  const y = d3.scaleLinear([0, d3.max(a.h.concat([a.usual])) * 1.12 || 1], [height - m.bottom, m.top]).nice();
  const svg = d3.select(node).append("svg").attr("viewBox", `0 0 ${width} ${height}`);
  const half = (DATA.meta.window - 1) / 2;

  svg.append("g").attr("class", "gridl").attr("transform", `translate(${m.left},0)`)
    .call(d3.axisLeft(y).ticks(4).tickSize(-(width - m.left - m.right)).tickFormat(""));
  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.left},0)`).call(d3.axisLeft(y).ticks(4));
  const ticks = d3.range(0, n, Math.ceil(n / 7));
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - m.bottom})`)
    .call(d3.axisBottom(x).tickValues(ticks).tickFormat(i => fmtWk(hw[i])));

  const b0 = Math.max(0, a.hi - half), b1 = Math.min(n - 1, a.hi + half);
  svg.append("rect").attr("x", x(b0)).attr("width", x(b1) - x(b0)).attr("y", m.top)
    .attr("height", height - m.top - m.bottom).attr("fill", "var(--ae)").attr("opacity", .12);
  svg.append("line").attr("x1", m.left).attr("x2", width - m.right).attr("y1", y(a.usual)).attr("y2", y(a.usual))
    .attr("stroke", "var(--text-muted)").attr("stroke-width", 1.5).attr("stroke-dasharray", "5,4");
  svg.append("path").attr("fill", "none").attr("stroke", "var(--line)").attr("stroke-width", 2)
    .attr("stroke-linejoin", "round").attr("d", d3.line().x((d, i) => x(i)).y(d => y(d))(a.h));
  svg.append("circle").attr("cx", x(a.hi)).attr("cy", y(a.h[a.hi])).attr("r", 5)
    .attr("fill", "var(--text-primary)").attr("stroke", "var(--surface-2)").attr("stroke-width", 2);

  const hair = svg.append("line").attr("y1", m.top).attr("y2", height - m.bottom)
    .attr("stroke", "var(--text-muted)").attr("stroke-width", 1).style("opacity", 0);
  const hdot = svg.append("circle").attr("r", 4).attr("fill", "var(--line)")
    .attr("stroke", "var(--surface-2)").attr("stroke-width", 2).style("opacity", 0);
  svg.append("rect").attr("x", m.left).attr("y", m.top).attr("width", width - m.left - m.right)
    .attr("height", height - m.top - m.bottom).attr("fill", "transparent")
    .on("pointermove", ev => {
      const i = Math.max(0, Math.min(n - 1, Math.round(x.invert(d3.pointer(ev)[0]))));
      hair.attr("x1", x(i)).attr("x2", x(i)).style("opacity", 1);
      hdot.attr("cx", x(i)).attr("cy", y(a.h[i])).style("opacity", 1);
      const t = document.getElementById("tip"); t.replaceChildren();
      t.append(el("b", null, String(a.h[i])), el("span", "tl", " units"), el("br"),
               el("span", "tl", fmtWk(hw[i]) + (i === a.hi ? " · alert week" : "")));
      tip.style("left", (ev.clientX + 14) + "px").style("top", (ev.clientY + 12) + "px").style("opacity", 1);
    })
    .on("pointerleave", () => { hair.style("opacity", 0); hdot.style("opacity", 0); tip.style("opacity", 0); });
}

window.addEventListener("resize", () => { if (state.open) render(); });
render();

// ---- embedded sample (only when alerts_data.js is absent) --------------------
function buildSample() {
  let r = 11; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const cats = ["FOODS", "HOUSEHOLD", "HOBBIES"], stores = ["CA_1", "CA_3", "TX_2", "WI_1"];
  const allWk = []; for (let y = 15; y <= 16; y++) for (let w = 1; w <= 52; w++) allWk.push(10000 + y * 100 + w);
  const sel = allWk.slice(52 + 4 - 6, 52 + 10 - 6 + 6).slice(0, 6);
  const weeks = {};
  sel.forEach(wk => {
    const iw = allWk.indexOf(wk), hw = allWk.slice(iw - 45, iw + 7), alerts = [];
    for (let j = 0; j < 40; j++) {
      const tier = j % 5 === 0 ? "both" : (j % 2 ? "if_only" : "ae_only");
      const base = 8 + Math.round(rnd() * 60);
      const h = Array.from({ length: 52 }, (_, i) => {
        let v = base + (rnd() - .5) * base * .5;
        if (tier !== "if_only" && i >= 41) v += base * 1.4;      // sustained shift
        if (tier !== "ae_only" && i === 45) v += base * 2.2;     // point shock
        return Math.max(0, Math.round(v));
      });
      const pif = tier === "ae_only" ? .3 + rnd() * .6 : .975 + rnd() * .025;
      const pae = tier === "if_only" ? .3 + rnd() * .6 : .975 + rnd() * .025;
      alerts.push({ id: `${cats[j % 3]}_${1 + j % 3}_${String(100 + j * 7).slice(-3)}_${stores[j % 4]}`,
        cat: cats[j % 3], store: stores[j % 4], sales: h[45], usual: base, pif, pae,
        c: Math.max(pif, pae), tier, h, hi: 45 });
    }
    alerts.sort((a, b) => b.c - a.c);
    const cnt = t => alerts.filter(a => a.tier === t).length;
    const c = { both: cnt("both") * 9, if_only: cnt("if_only") * 17, ae_only: cnt("ae_only") * 15 };
    weeks[wk] = { hw, alerts, counts: { ...c, total: c.both + c.if_only + c.ae_only, scored: 15480 } };
  });
  return { meta: { weeks: sel, fp_budget: .05, window: 13, lag_weeks: 6 }, weeks };
}
</script>
