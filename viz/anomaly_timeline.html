<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anomaly Timeline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --ink: #1a1c1f; --muted: #6b7280;
    --grid: #e5e7eb; --line: #334155; --axis: #9ca3af;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e5e7eb; --muted: #9ca3af;
      --grid: #232a33; --line: #94a3b8; --axis: #5b6472;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --ink: #e5e7eb; --muted: #9ca3af;
    --grid: #232a33; --line: #94a3b8; --axis: #5b6472;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0 0 20px; }
  .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .controls label { color: var(--muted); font-size: 13px; }
  select {
    font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--grid);
    background: var(--panel); color: var(--ink);
  }
  #chart { width: 100%; }
  #chart svg { width: 100%; height: auto; display: block; }
  .grid line { stroke: var(--grid); shape-rendering: crispEdges; }
  .grid path { stroke: none; }
  .axis text { fill: var(--muted); font-size: 11px; }
  .axis path, .axis line { stroke: var(--axis); }
  .salesline { fill: none; stroke: var(--line); stroke-width: 1.6px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .legend .item { display: flex; align-items: center; gap: 7px; }
  .legend .swatch { width: 11px; height: 11px; border-radius: 50%; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .summary { margin-top: 12px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; }
  .summary .s-item { color: var(--ink); }
  .summary .s-count { font-weight: 600; }
  .summary .s-sub { color: var(--muted); font-size: 12px; }
  #tooltip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--panel); border: 1px solid var(--grid); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; color: var(--ink); box-shadow: 0 4px 16px rgba(0,0,0,.18);
    max-width: 240px; z-index: 10;
  }
  #tooltip .t-wk { font-weight: 600; margin-bottom: 4px; }
  #tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; }
  #tooltip .flag { font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Anomaly Timeline</h1>
    <p>Weekly sales for one SKU × store, with anomaly flags per model.</p>
  </header>

  <div class="controls">
    <label>Series <select id="series-select"></select></label>
  </div>

  <div id="chart"></div>
  <div class="legend" id="legend"></div>
  <div class="summary" id="summary"></div>
  <p class="note" id="note"></p>
</div>
<div id="tooltip"></div>

<!-- Real data (generated by viz/export_series.py). Absent in standalone preview
     -> harmless 404 -> the page falls back to embedded sample data below. -->
<script src="series_data.js"></script>

<script>
// ----------------------------------------------------------------------------
// Data source: real data from series_data.js (window.SERIES_DATA) if present,
// otherwise an embedded sample so the page renders standalone.
// ----------------------------------------------------------------------------
const DATA = window.SERIES_DATA || buildSample();
const MODELS = DATA.models;            // [{key,label,threshold,color}, ...]
const IS_SAMPLE = !window.SERIES_DATA;

const tooltip = d3.select("#tooltip");
let current = 0;

// ----------------------------------------------------------------------------
// Controls + legend (both generated from data — multi-model ready)
// ----------------------------------------------------------------------------
const sel = d3.select("#series-select");
sel.selectAll("option").data(DATA.series).join("option")
   .attr("value", (d, i) => i)
   .text(d => `${d.id}`);
sel.on("change", function () { current = +this.value; render(); });

d3.select("#legend").selectAll(".item")
  .data([{label: "Weekly sales", color: "var(--line)", lineMark: true}, ...MODELS])
  .join("div").attr("class", "item")
  .html(d => d.lineMark
    ? `<span style="width:16px;height:2px;background:${d.color};display:inline-block"></span> ${d.label}`
    : `<span class="swatch" style="background:${d.color}"></span> ${d.label} flag`);

d3.select("#note").text(IS_SAMPLE
  ? "Showing embedded sample data (includes a mock AE model to preview the multi-model overlay). Run export_series.py and reload with series_data.js for real data."
  : `Flags: a week is flagged when its model score ≥ threshold.`);

// ----------------------------------------------------------------------------
// Render (redraws on series change and on resize)
// ----------------------------------------------------------------------------
function render() {
  const s = DATA.series[current];
  const weeks = s.weeks;

  // per-model flag summary (makes a 0-flag series read as intentional)
  const scoredCount = weeks.filter(d => d.scores[MODELS[0].key] != null).length;
  const unscored = weeks.length - scoredCount;
  d3.select("#summary").selectAll(".s-item")
    .data(MODELS).join("div").attr("class", "s-item")
    .html(mdl => {
      const n = weeks.filter(d => d.scores[mdl.key] != null && d.scores[mdl.key] >= mdl.threshold).length;
      return `<span class="s-count" style="color:${mdl.color}">${n}</span> ` +
             `week${n === 1 ? "" : "s"} flagged by ${mdl.label}`;
    });
  d3.select("#summary").selectAll(".s-sub").data([0]).join("div").attr("class", "s-sub")
    .text(`${scoredCount} scored · ${unscored} unscored (first ~52 weeks have no year-over-year baseline)`);
  const W = Math.min(900, document.querySelector("#chart").clientWidth || 900);
  const H = 380;
  const m = { top: 24, right: 16, bottom: 34, left: 46 };

  const x = d3.scaleLinear().domain([0, weeks.length - 1]).range([m.left, W - m.right]);
  const y = d3.scaleLinear()
    .domain([0, d3.max(weeks, d => d.sales) * 1.12]).nice()
    .range([H - m.bottom, m.top]);

  d3.select("#chart").selectAll("svg").remove();
  const svg = d3.select("#chart").append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`);

  // gridlines + y axis
  svg.append("g").attr("class", "grid")
    .attr("transform", `translate(${m.left},0)`)
    .call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.left - m.right)).tickFormat(""));
  svg.append("g").attr("class", "axis")
    .attr("transform", `translate(${m.left},0)`)
    .call(d3.axisLeft(y).ticks(5));

  // x axis: index-based positions (avoids fake gaps at fiscal-year boundaries),
  // labelled with the wm_yr_wk at a handful of ticks.
  const tickIdx = d3.range(0, weeks.length, Math.ceil(weeks.length / 8));
  svg.append("g").attr("class", "axis")
    .attr("transform", `translate(0,${H - m.bottom})`)
    .call(d3.axisBottom(x).tickValues(tickIdx).tickFormat(i => weeks[i] ? weeks[i].wk : ""));

  // sales line
  const line = d3.line().x((d, i) => x(i)).y(d => y(d.sales));
  svg.append("path").datum(weeks).attr("class", "salesline").attr("d", line);

  // anomaly markers — one layer per model (this is the multi-model scaffold)
  MODELS.forEach((mdl, mi) => {
    const flagged = weeks
      .map((d, i) => ({ d, i }))
      .filter(({ d }) => d.scores[mdl.key] != null && d.scores[mdl.key] >= mdl.threshold);
    svg.append("g").selectAll("circle").data(flagged).join("circle")
      .attr("cx", ({ i }) => x(i))
      .attr("cy", ({ d }) => y(d.sales) - 10 - mi * 11)   // stack models above the point
      .attr("r", 4.5)
      .attr("fill", mdl.color)
      .attr("stroke", "var(--bg)").attr("stroke-width", 1.5);
  });

  // hover layer
  const focus = svg.append("line")
    .attr("y1", m.top).attr("y2", H - m.bottom)
    .attr("stroke", "var(--axis)").attr("stroke-dasharray", "3,3").style("opacity", 0);

  svg.append("rect")
    .attr("x", m.left).attr("y", m.top)
    .attr("width", W - m.left - m.right).attr("height", H - m.top - m.bottom)
    .attr("fill", "transparent")
    .on("mousemove", function (ev) {
      const mx = d3.pointer(ev)[0];
      const i = Math.round(x.invert(mx));
      if (i < 0 || i >= weeks.length) return;
      const d = weeks[i];
      focus.attr("x1", x(i)).attr("x2", x(i)).style("opacity", 1);
      const rows = MODELS.map(mdl => {
        const sc = d.scores[mdl.key];
        if (sc == null) return `<div class="t-row"><span>${mdl.label}</span><span>—</span></div>`;
        const flagged = sc >= mdl.threshold;
        return `<div class="t-row"><span>${mdl.label}</span>` +
               `<span class="flag" style="color:${flagged ? mdl.color : 'var(--muted)'}">` +
               `${sc.toFixed(3)}${flagged ? " ⚑" : ""}</span></div>`;
      }).join("");
      tooltip.html(`<div class="t-wk">week ${d.wk}</div>` +
                   `<div class="t-row"><span>sales</span><span>${d.sales}</span></div>${rows}`)
        .style("left", (ev.clientX + 14) + "px").style("top", (ev.clientY + 14) + "px")
        .style("opacity", 1);
    })
    .on("mouseleave", () => { focus.style("opacity", 0); tooltip.style("opacity", 0); });
}

window.addEventListener("resize", render);
render();

// ----------------------------------------------------------------------------
// Embedded sample (only used when series_data.js is absent). Includes a spike,
// a level shift (with IF-score absorption), a drop, and a mock AE that catches
// the level-shift tail the IF misses — a preview of the Phase 6/7 story.
// ----------------------------------------------------------------------------
function buildSample() {
  function series(id, cat, store, seed) {
    let r = seed; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    const weeks = [];
    const N = 104, base = 14;
    for (let i = 0; i < N; i++) {
      let sales = base + 3 * Math.sin(2 * Math.PI * i / 52) + (rnd() - 0.5) * 4;
      let ifScore = 0.40 + rnd() * 0.06, aeScore = 0.20 + rnd() * 0.10;
      if (i === 30) { sales = base * 3.6; ifScore = 0.66; aeScore = 0.74; }        // spike
      if (i >= 60 && i < 72) {                                                     // level shift
        sales = base + 10 + (rnd() - 0.5) * 3;
        const k = i - 60;
        ifScore = Math.max(0.49, 0.64 - k * 0.018);   // absorption: decays below threshold
        aeScore = 0.70;                               // mock AE holds across the plateau
      }
      if (i === 88) { sales = base * 0.18; ifScore = 0.58; aeScore = 0.66; }        // drop
      const wk = 11100 + Math.floor(i / 52) * 100 + (i % 52) + 1;
      weeks.push({ wk, sales: Math.max(0, Math.round(sales)),
                   scores: { if: +ifScore.toFixed(3), ae: +aeScore.toFixed(3) } });
    }
    return { id, cat, store, weeks };
  }
  return {
    models: [
      { key: "if", label: "Isolation Forest", threshold: 0.5505, color: "#e4572e" },
      { key: "ae", label: "LSTM AE (mock)",   threshold: 0.50,   color: "#4c6ef5" }
    ],
    series: [
      series("FOODS_3_090_CA_3 (sample)", "FOODS", "CA_3", 7),
      series("HOUSEHOLD_1_118_TX_2 (sample)", "HOUSEHOLD", "TX_2", 42)
    ]
  };
}
</script>
</body>
</html>
